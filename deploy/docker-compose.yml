# DEMO: se copia a ~/apps/GrammarErrorDetection/webTeachers/web/ en el VPS en cada deploy (lo hace el workflow).
# "name" fija el proyecto: sin el, compose usaria el nombre de la carpeta ("web") y --remove-orphans
# podria tocar los contenedores de produccion. El servicio se llama web-demo porque en app-net el alias
# "web" ya es el de produccion.
name: grammarpractice-demo-web
services:
  web-demo:
    image: ghcr.io/green-dv/grammarerrordetection_web_demo:latest
    restart: unless-stopped
    networks: [app-net]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  app-net:
    external: true
