server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Los .wasm deben salir como application/wasm para que el navegador los compile en streaming.
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
    }

    # blazor publica cada archivo con su version precomprimida (.gz).
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm text/plain;

    # Los archivos de _framework llevan un hash en el nombre: nunca cambian con el mismo nombre.
    location /_framework/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # El shell y la configuracion se revalidan siempre, para que un deploy se vea de inmediato.
    location ~ ^/(index\.html|appsettings(\.[A-Za-z]+)?\.json)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA: cualquier ruta que no sea un archivo (p. ej. /auth/login) devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
