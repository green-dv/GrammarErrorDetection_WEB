    <script>
        // Tema antes de que cargue Blazor (evita el destello blanco). Preferencia: system | light | dark.
        (function () {
            var key = 'ceti-theme', media = window.matchMedia('(prefers-color-scheme: dark)');
            function preference() {
                try { var value = localStorage.getItem(key); return value === 'light' || value === 'dark' ? value : 'system'; }
                catch (e) { return 'system'; }
            }
            function apply() {
                var choice = preference(), theme = choice === 'system' ? (media.matches ? 'dark' : 'light') : choice;
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.setAttribute('data-bs-theme', theme);
                return theme;
            }
            apply();
            if (media.addEventListener) media.addEventListener('change', function () { if (preference() === 'system') apply(); });
            window.cetiTheme = {
                get: preference,
                set: function (choice) {
                    try { if (choice === 'light' || choice === 'dark') localStorage.setItem(key, choice); else localStorage.removeItem(key); }
                    catch (e) { }
                    return apply();
                }
            };
        })();
    </script>
